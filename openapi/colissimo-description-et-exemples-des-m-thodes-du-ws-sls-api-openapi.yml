  /planPickup:
    post:
      tags:
      - Description et exemples des méthodes du WS SLS
      summary: planPickup
      description: 'La méthode planPickup() permet de faire une demande d’emport d’un colis retour déposé par l’expé diteur dans sa boîte aux lettres.

        Le colis doit avoir été préalablement annoncé auprès de La Poste.

        Cette méthode sera utilisée pour confirmer de manière ferme l’emport à la date voulue, après avoir annoncé en premier lieu l’expédition au moyen de la méthode GenerateLabel.

        Cette méthode est compatible avec le code produit CORE (8R Colissimo Retour France) et CORF (CQ Colissimo Retour International)'
      operationId: planPickup_2
      parameters:
      - name: apiKey
        in: header
        description: L'apiKey
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanPickupRequest'
      responses:
        '200':
          description: Traitement OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanPickupResponse'
