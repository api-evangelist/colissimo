    Fields:
      type: object
      properties:
        field:
          type: array
          description: "Taille du colis en centimètres: longueur,             largeur et hauteur<br/>\nLongueur <= 274 cm<br/>\nLongueur + curconfé            rence (2 x hauteur + 2 x largeur) <= 330 cm<br/>\n               \n                           <field>\n                   <key>LENGTH</key>\n                               <value>30</value>\n               </field>\n                           <field>\n                   <key>WIDTH</key>\n                               <value>20</value>\n               </field>\n                           <field>\n                   <key>HEIGHT</key>\n                               <value>10</value>\n               </field>\n                           \n<b>Code barre personnalisé</b><br/>\nAjouter un code barre             personnalisé sur les étiquettes standards GEOLABEL conf. chapitre \"            Option d'envoi/Code barres client\" (maximum 17 caractères alpha numé            riques et 25 numériques)<br/>\n               \n               <field>            \n                      <key>PRINT_CUSTOMER_BARCODE</key>\n                                  <value>1</value>\n               </field>\n                           <field>\n                       <key>CUSTOMER_BARCODE</key>            \n                       <value>REF12345678</value>\n                           </field>\n\nIF PRINT_CUSTOMER_BARCODE = 1, affiche le code barre             avec la valeur du champ CUSTOMER_BARCODE (voir les exemples d'etiquettes)<br/>            \nIF PRINT_CUSTOMER_BARCODE = 2, affiche le code barre avec la valeur             du numéro de colis (voir les exemples d'etiquettes)<br/>\n<br/>\n            <br/>\n<b>Etiquette avec référence client</b><br/>\nSur les étiquettes             standard GEOLABEL au format 10x15 et PDF , il est possible d'ajouter             un texte personnalisé de 15 caractères maximum sous les étiquettes.<br/>            \nLe champ PRINT_CUSTOMER_LABEL permet d'afficher ou non le texte, et             le champ CUSTOMER_LABEL précise le texte.<br/>\n    \n                         <field>\n                 <key>PRINT_CUSTOMER_LABEL</key>\n                             <value>1</value>\n             </field>\n    \n                \n             <field>\n                 <key>CUSTOMER_LABEL</key>            \n                 <value>ABCDEFG</value>\n             </field>\n                \n<br/>\nRemarque : il n'est pas possible d'afficher en même temps             un code à barre personnalisé et un texte personnalisé<br/>\n<br/>            \nRemarque 2 : le texte personnalisé n'apparaîtra pas sur l'étiquette             en cas de réimpression par getlabel (ou sur un automate La Poste).<br/>            \n<br/>\n<b>CN23 format</b><br/>\nFormats spécifiques pour la CN23             :<br/>\n    \n             <field>\n                 <key>OUTPUT_PRINT_TYPE_CN23</key>            \n                 <value>ZPL_10x12_203dpi</value>\n             </field>            \n    \nFormats possibles :<br/>\nZPL_10x12_203dpi<br/>\nZPL_10x12_300dpi<br/>            \nDPL_10x12_203dpi<br/>\nDPL_10x12_300dpi<br/>\nPDF_10x12_300dpi<br/>            \nPDF_A4_300dpi<br/>\n<b>une étiquette unique (UL) incluant la CN23             sur la même page</b> <br/>\nles formats acceptés sont : <br/>\n            ZPL_10x15_203dpi_UL<br/>\nZPL_10x15_300dpi_UL<br/>\nDPL_10x15_203dpi_UL<br/>            \nDPL_10x15_300dpi_UL<br/>\nPDF_10x15_300dpi_UL<br/>\nPDF_A4_300dpi_UL<br/>            \n    \n             <field>\n                 <key>OUTPUT_PRINT_TYPE_CN23</key>            \n                 <value>PDF_10x15_300dpi_UL</value>\n                         </field>\n    \nLe format de la CN23 (output_print_type_CN23) et format             de l'étiquette (outputprinting type) doit être le même pour bénéficier             de la fonctionnalité d'étiquette unifiée: <br/><br/>\nSi le colis             n'est pas éligile à la CN23, le format affiché sera<br/>\n(OutputFormat             block: outputprinting type field).<br/>\nSi il y a plus de 3 articles,             la CN23 affichera que les 3 premiers mais les totaux seront pour l'ensemble             des articles<br/>\nCette option écrase les personalisations suivantes             : <br/>\n- Ajout d'une étiquette personalisée (PRINT_CUSTOMER_LABEL)<br/>            \n- Ajout d'une référence CAB personalisée (PRINT_CUSTOMER_BARCODE)<br/><br/>            \n<b>Groupage de colis</b><br/>\n<br/>\n- Les paramètres additionnels             du service sls pour tracer les colis sont les suivants : <br/>\n•\t            Etiquette de traçage du colis<br/>\n•\tNombre total de packages<br/>            \n•\tIteration (numéro du package)<br/>\n<br/>\n<br/>\n                           <field>\n                  <key>TYPE_MULTI_PARCEL</key>\n                              <value>FOLLOWER</value>\n               </field>            \n               <field>\n                  <key>PARCEL_ITERATION_NUMBER</key>            \n                  <value>2</value>\n               </field>\n                           <field>\n                  <key>TOTAL_NUMBER_PARCEL</key>            \n                  <value>5</value>\n               </field>\n<br/>            \n- Les paramètres additionnels du service sls pour les colis master sont             les suivants : <br/>\n•\tEtiquette du colis master<br/>\n•\tNombre             total de packages<br/>\n•\tIteration (numéro du package)<br/>\n•                Limitation à 5 colis<br/>\n•\tListe des packages suivis<br/>\n                 \n     \n              <field>\n                   <key>TYPE_MULTI_PARCEL</key>            \n                   <value>MASTER</value>\n             </field>\n                         <field>\n                  <key>PARCEL_ITERATION_NUMBER</key>            \n                   <value>2</value>\n             </field>\n                         <field>\n                  <key>TOTAL_NUMBER_PARCEL</key>            \n                   <value>5</value>\n             </field>\n                         <field>\n                  <key>LIST_FOLLOWER_PARCEL</key>            \n\t\t\t\t     <value>8Q53764663714/8Q53764663721/8Q53764663738/8Q53764663748/8Q53764663758</value>            \n             </field>\n<br/>\n<b>BuyNowPayLater</b><br/>\nCette             saisie permet de notifier l'identifiant de la transaction attachée à             un colis Colissimo<br/>\noffre payante en paiement différé et fractionné            .<br/>\nCe paramètre id est tronqué à 50 caractères<br/>\n    \n                         <field>\n                 <key>BNPL</key>\n                             <value>ID de transaction</value>\n             </field>\n                \n<b>CUSER_INFO_TEXT</b><br/>\nRéférence de recherche pour OSC.             La référence peut être unique ou partagée sur plusieurs colis, afin             de permettre de rechercher une liste de colis ayant la même référence             par exemple.<br/>\n    \n             <field>\n                             <key>CUSER_INFO_TEXT</key>\n                 <value>xxxxxxxxxxxxxxxxxx</value>            \n             </field>\n    \n<b>CUSER_INFO_TEXT_4</b><br/>\nRéfé            rence partenaire (si communiquée par vos interlocuteurs Colissimo). Spé            cifique à l'utilisation du service par nos partenaires.<br/>\n    \n                         <field>\n                 <key>CUSER_INFO_TEXT_4</key>            \n                 <value>xxxxxxxxxxxxxxxxxx</value>\n             </field>            \n    \n<br/>\n<b>EORI (Economics Operators Registration and Identification)</b><br/>            \n<br/>Numéros EORI de l'expéditeur et/ou du destinataire qui seront visibles             notamment sur la déclaration douanière.\n  * Utiliser le champs 'EORI_ADDRESSEE'             pour l'EORI du destinataire\n    <br/>\n  * Utiliser le champs 'EORI'             pour l'EORI de l'expéditeur (obligatoire pour les envois vers les US)             : 2 lettres + 9 chiffres.\n    \n             <field>\n                            <key>EORI</key>\n                <value>1234567</value>\n                         </field>\n             <field>\n                <key>EORI_ADRESSEE</key>\n                            <value>1234567</value>\n             </field>\n"
          items:
            $ref: '#/components/schemas/Field'
        customField:
          type: array
          items:
            $ref: '#/components/schemas/Field'
      description: <i>SUB</i> <br/>  Ce bloc peut être utilisé        pour renseigner l’identifiant <br/><br/> -Gestion des utilisateurs </b> <br/>        -Colissimo Pass ID <br/> - GST <br/> - EORI
    ParcelRequestV2:
      required:
      - weight
      type: object
      properties:
        parcelNumber:
          type: string
          description: <i>AN13</i> <br/>  Non utilisé (utilisation interne à La Poste uniquement)
        insuranceAmount:
          type: integer
          description: <i>N</i> <br/>  Non            utilisé (utilisation interne à La Poste uniquement)
          format: int32
        insuranceValue:
          type: integer
          description: '<i>N</i> <br/>  Valeur assurée. <br/><br/> Par défaut, renseigner "            0". <br/> Si l’option d’assurance est choisie, renseigner le montant             du niveau d’assurance souhaité parmi les 6 niveaux proposés. Le montant             doit être exprimé en centimes. Exemple : 500000 pour 5000 EUR. <br/><br/>             Si la valeur renseignée ne correspond pas à l’un des 6 niveaux d’assurance,             la valeur affichée sera celle du niveau dans lequel le montant renseigné             se situe. Exemple : 16200 soit 162 EUR, deviendra 30000 EUR soit 300             EUR. <br/><br/>6 niveaux d’assurance optionnelle : <br/> <ul> <li>150             EUR ; </li> <li>300 EUR ; </li> <li>500 EUR ; </li> <li>1000 EUR ; </li>             <li>2000 EUR ; </li> <li>5000 EUR ;</li></ul><br/>Maximum= 5000€.'
          format: int32
        recommendationLevel:
          type: string
          description: Niveau
        weight:
          type: number
          description: '<i>N</i> <br/>  Poids du colis en kg. <br/> Exemple : "5.50"            . '
          format: float
        nonMachinable:
          type: boolean
          description: '<i>B</i> <br/>  Format             du colis. <br/> Si la balise productCode a les codes <b>HD</b> renseigner             "false" (ou "0") par défaut. <br/> Passer à "true" (ou "1")             pour indiquer que le format du colis est non standard (non mécanisable).             '
        returnReceipt:
          type: boolean
          description: '<i>B</i> <br/>  Avis             de réception. <br/><br/> Par défaut, renseigner "false " (ou "0"            ). '
        instructions:
          type: string
          description: '<i>AN1...35</i> <br/>  Permet d’            afficher sur l’étiquette : <br/> <ul> <li>Des indications complémentaires             pour la livraison,</li> <li>Le motif du retour.</li> </ul>  <br/>  Exemple             pour une livraison : « à gauche au portail intérieur ». '
        pickupLocationId:
          type: string
          description: '<i>N6</i> <br/>  Identifiant du point de             retrait pour une livraison Colissimo hors domicile. <br/><br/> Cette             balise : <br/> <ul> <li>Doit être renseignée si productCode vaut <b>HD</b></li>             <li>Doit être vide si productCode vaut <b>DOM</b> ou <b>DOS.</b></li>             </ul> <br/> Si le code réseau est "X00", il sera obligatoire de renseigner             le bloc fields.  '
        ftd:
          type: boolean
          description: '<i>B</i> <br/>  Pour les envois vers l''outre-mer             <br/><br/> Par défaut, renseigner "false " (ou "0"). <br/><br/>Obligatoire,             à renseigner par "true " (ou "1"), pour les envois vers l’Outre-Mer             uniquement.   '
        ddp:
          type: boolean
          description: '<i>B</i> <br/>  Pour les             envois vers l’international <br/><br/> Indiquer « 1 » si le colis est             ddp, <br/><br/> Par défaut, renseigner « 0 » (zéro) '
        disabledDeliveryBlockingCode:
          type: string
          description: 'Prérequis : avoir activé le service "Code Bloquant" sur             la Colissimo Box<br/><br/>Indique si la livraison doit se faire sans             code bloquant. (Si aucune valeur n''est renseignée, les colis éligibles             seront livrés avec code bloquant)<br/><br/>1 = true : Désactive le code             bloquant<br/>0 = False : Ne désactive pas le code bloquant<br/>Vide             = False : Ne désactive pas le code bloquant'
        codamount:
          type: integer
          description: '<i>N</i> <br/>  Montant attendu pour une livraison contre             remboursement.  <br/><br/> Par défaut, renseigner "false" (ou "0"            ). <br/><br/> Obligatoire si la valeur de la balise COD est "true" (ou             "1"). '
          format: int32
        codcurrency:
          type: string
          description: COD devise
        cod:
          type: boolean
          description: '<i>B</i> <br/>  Indique si             la livraison doit se faire contre remboursement. <br/> <br/> Par dé            faut, renseigner "0" (zéro). <br/><br/>  Passer à "true" (ou "1"            ) si la livraison doit se faire contre remboursement.  '
      description: <i>SUB</i> <br/>
