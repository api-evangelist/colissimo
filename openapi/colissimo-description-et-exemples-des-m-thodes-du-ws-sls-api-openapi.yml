  /generateLabel:
    post:
      tags:
      - Description et exemples des méthodes du WS SLS
      summary: generateLabel
      description: 'Cette méthode est proposée pour créer les expéditions relevant des offres suivantes, quels que soient le produit ou la destination associés :


        Offre France : Colissimo Domicile, Point Retrait, Retour,


        Offre Internationale : Colissimo Expert, Domicile, Point Retrait, Retour,


        Offre Outre-Mer : Colissimo Domicile et Colissimo Eco.


        Remarque : il est recommandé de ne pas envoyer un champ facultatif plutôt que de l’envoyer vide.


        Fonction principale d''affranchissement :

        Gé nère une annonce informatique du colis et ses documents associés(é tiquette et déclarations douanières)

        Réponse:

        Ce service retourne une Map contenant un objet json et 0 à 3 tableaux d''octets.

        La Map retournée est un objet MultipartBody.

        L''objet json est sauvegardé avec la clé "jsonInfos" et est de type "application-json".

        Les trois tableaux d''octets sont chacun sauvegardé avec les clés : proforma, label et cn23, et sont de type "application/octet-stream".

        Exemple de client en cxf :


        WebClient client = WebClient.create(URL);

        client.type(" application/json").accept("multipart/mixed");

        MultipartBody bodyResponse = client.post(ObjetJsonRequete, MultipartBody.class);


        A ce niveau, chaque objet sauvegardé dans la Map MultipartBody est récupéré grace à sa clé.

        Pour le tableau d''octets "label", on utilise le code ci-dessous:


        DataHandler dataHandler = bodyResponse.getAttachment("label" ).getDataHandler();

        InputStream is = dataHandler.getInputStream(); L''objet jsonInfos a le format ci-dessous:

        {

        "messages":Array[Message],

        " parcelNumber":String,

        "parcelNumberPartner":String

        }


        Message

        {

        " id":String,

        "type":String,

        "messageContent" :String

        }'
      operationId: generateLabel_1
      parameters:
      - name: apiKey
        in: header
        description: L'apiKey
        schema:
          type: string
      requestBody:
        description: numéro de contrat
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateLabelRequestV31'
      responses:
        '200':
          description: Traitement OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateLabelV2Response'
        '400':
