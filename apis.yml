aid: colissimo

name: Colissimo

description: Colissimo is La Poste's parcel delivery brand for France and international shipping. For business shippers it publishes developer
  web services on ws.colissimo.fr - the Shipping Label Service (SLS, web service d'affranchissement) for labels, CN23 customs forms, bordereaux
  and pickup planning, available as SOAP (WSDL) and REST (OpenAPI), and the Point Retrait web service (SOAP) for finding pickup and drop-off points
  - documented in Redoc on the Colissimo Entreprise site.

